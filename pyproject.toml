[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tambert"
version = "0.1.0"
requires-python = ">=3.11"

# scripts/ is treated as the package root — tokenizer/, data_pipeline/, and
# paths.py all become importable from anywhere as top-level names, no
# sys.path.insert required in any file.
[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["paths", "training_utils"]

[tool.setuptools.packages.find]
where = ["scripts"]